<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Outer border top-left finder pattern -->
  <rect x="2" y="2" width="12" height="12" rx="1.5" fill="#E85D2F"/>
  <rect x="4" y="4" width="8" height="8" rx="1" fill="white"/>
  <rect x="6" y="6" width="4" height="4" rx="0.5" fill="#E85D2F"/>

  <!-- Outer border top-right finder pattern -->
  <rect x="18" y="2" width="12" height="12" rx="1.5" fill="#E85D2F"/>
  <rect x="20" y="4" width="8" height="8" rx="1" fill="white"/>
  <rect x="22" y="6" width="4" height="4" rx="0.5" fill="#E85D2F"/>

  <!-- Outer border bottom-left finder pattern -->
  <rect x="2" y="18" width="12" height="12" rx="1.5" fill="#E85D2F"/>
  <rect x="4" y="20" width="8" height="8" rx="1" fill="white"/>
  <rect x="6" y="22" width="4" height="4" rx="0.5" fill="#E85D2F"/>

  <!-- Data dots bottom-right area -->
  <rect x="18" y="18" width="4" height="4" rx="0.5" fill="#E85D2F"/>
  <rect x="24" y="18" width="4" height="4" rx="0.5" fill="#E85D2F"/>
  <rect x="18" y="24" width="4" height="4" rx="0.5" fill="#E85D2F"/>
  <rect x="24" y="24" width="4" height="4" rx="0.5" fill="#E85D2F"/>
  <rect x="22" y="22" width="2" height="2" rx="0.3" fill="#E85D2F"/>
</svg>
